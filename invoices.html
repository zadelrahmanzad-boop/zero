<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero POS - الفواتير</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .invoice-print { background: white; padding: 40px; max-width: 800px; margin: 0 auto; }
        .invoice-header { text-align: center; border-bottom: 2px solid var(--dark); padding-bottom: 20px; margin-bottom: 30px; }
        .invoice-header img { max-width: 100px; margin-bottom: 10px; }
        .invoice-details { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        .invoice-table th, .invoice-table td { border: 1px solid #ddd; padding: 12px; text-align: right; }
        .invoice-table th { background: #f8f9fa; }
        .invoice-totals { text-align: left; margin-top: 20px; }
        .invoice-totals div { margin: 10px 0; font-size: 16px; }
        .invoice-totals .grand-total { font-size: 20px; font-weight: bold; border-top: 2px solid var(--dark); padding-top: 10px; }
        @media print { .no-print { display: none !important; } body { background: white; } }
    </style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img id="sidebarLogo" class="sidebar-logo" src="" alt="شعار الشركة">
                <div id="sidebarCompany" class="sidebar-company">Zero POS</div>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item"><span class="menu-icon">🏠</span><span>الرئيسية</span></a>
                <a href="sales.html" class="menu-item"><span class="menu-icon">🛒</span><span>المبيعات</span></a>
                <a href="products.html" class="menu-item"><span class="menu-icon">📦</span><span>المنتجات</span></a>
                <a href="inventory.html" class="menu-item"><span class="menu-icon">🏭</span><span>المخازن</span></a>
                <a href="invoices.html" class="menu-item active"><span class="menu-icon">🧾</span><span>الفواتير</span></a>
                <a href="reports.html" class="menu-item"><span class="menu-icon">📊</span><span>التقارير</span></a>
                <a href="users.html" class="menu-item admin-only"><span class="menu-icon">👥</span><span>المستخدمين</span></a>
                <a href="#" class="menu-item" onclick="logout(); return false;"><span class="menu-icon">🚪</span><span>تسجيل الخروج</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div class="user-info">
                    <div class="user-avatar current-user-name">A</div>
                    <div>
                        <div style="font-weight:bold;" class="current-user-name">المستخدم</div>
                        <div style="font-size:12px; color:var(--secondary);" class="current-user-role">-</div>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:15px;">
                    <div id="sessionTimer" class="session-timer">00:00:00</div>
                    <div style="font-size:14px; color:var(--secondary);"><span id="currentDate"></span></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">🧾 الفواتير</h2>
                    <div style="display:flex; gap:10px;">
                        <input type="date" id="filterDate" class="form-control" style="width:auto;">
                        <button class="btn btn-secondary" onclick="filterInvoices()">🔍 بحث</button>
                        <a href="sales.html" class="btn btn-primary"><span>➕</span> فاتورة جديدة</a>
                    </div>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead><tr><th>رقم الفاتورة</th><th>العميل</th><th>المنتجات</th><th>المبلغ</th><th>الحالة</th><th>التاريخ</th><th>بواسطة</th><th>الإجراءات</th></tr></thead>
                        <tbody id="invoicesTableBody"><tr><td colspan="8" style="text-align:center; color:var(--secondary);">جاري التحميل...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="invoiceViewModal">
        <div class="modal" style="max-width:900px;">
            <div class="modal-header no-print"><h3 class="modal-title">🧾 عرض الفاتورة</h3><button class="modal-close" onclick="closeModal('invoiceViewModal')">×</button></div>
            <div class="modal-body" id="invoiceContent"></div>
            <div class="modal-footer no-print">
                <button class="btn btn-secondary modal-cancel" onclick="closeModal('invoiceViewModal')">إغلاق</button>
                <button class="btn btn-primary" onclick="window.print()">🖨️ طباعة</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script type="module">
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    </script>
</body>
</html>
