<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e293b">
    <title>Zero POS - المنتجات</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img id="sidebarLogo" class="sidebar-logo" src="" alt="شعار الشركة">
                <div id="sidebarCompany" class="sidebar-company">Zero POS</div>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item"><span class="menu-icon">🏠</span><span>الرئيسية</span></a>
                <a href="sales.html" class="menu-item"><span class="menu-icon">🛒</span><span>المبيعات</span></a>
                <a href="products.html" class="menu-item active"><span class="menu-icon">📦</span><span>المنتجات</span></a>
                <a href="inventory.html" class="menu-item"><span class="menu-icon">🏭</span><span>المخازن</span></a>
                <a href="invoices.html" class="menu-item"><span class="menu-icon">🧾</span><span>الفواتير</span></a>
                <a href="reports.html" class="menu-item"><span class="menu-icon">📊</span><span>التقارير</span></a>
                <a href="users.html" class="menu-item admin-only"><span class="menu-icon">👥</span><span>المستخدمين</span></a>
                <a href="#" class="menu-item" onclick="logout(); return false;"><span class="menu-icon">🚪</span><span>تسجيل الخروج</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div class="user-info">
                    <div class="user-avatar current-user-name">A</div>
                    <div>
                        <div style="font-weight:bold;" class="current-user-name">المستخدم</div>
                        <div style="font-size:12px; color:var(--secondary);" class="current-user-role">-</div>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:15px;">
                    <div id="sessionTimer" class="session-timer">00:00:00</div>
                    <div style="font-size:14px; color:var(--secondary);"><span id="currentDate"></span></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><h2 class="card-title">📦 المنتجات</h2><button class="btn btn-primary" onclick="openModal('addProductModal')"><span>➕</span> إضافة منتج</button></div>
                <div class="table-container">
                    <table class="data-table">
                        <thead><tr><th>الكود</th><th>الاسم</th><th>التصنيف</th><th>سعر الشراء</th><th>سعر البيع</th><th>الكمية</th><th>الربح</th><th>الإجراءات</th></tr></thead>
                        <tbody id="productsTableBody"><tr><td colspan="8" style="text-align:center; color:var(--secondary);">جاري التحميل...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="addProductModal">
        <div class="modal">
            <div class="modal-header"><h3 class="modal-title">➕ إضافة منتج جديد</h3><button class="modal-close" onclick="closeModal('addProductModal')">×</button></div>
            <div class="modal-body">
                <form id="addProductForm">
                    <div class="grid-2"><div class="form-group"><label>اسم المنتج *</label><input type="text" id="productName" class="form-control" required></div><div class="form-group"><label>كود المنتج *</label><input type="text" id="productCode" class="form-control" required></div></div>
                    <div class="grid-2"><div class="form-group"><label>التصنيف *</label><input type="text" id="productCategory" class="form-control" placeholder="مثال: إلكترونيات" required></div><div class="form-group"><label>الوحدة</label><select id="productUnit" class="form-control"><option value="قطعة">قطعة</option><option value="كيلو">كيلو</option><option value="لتر">لتر</option><option value="متر">متر</option><option value="علبة">علبة</option><option value="كرتونة">كرتونة</option></select></div></div>
                    <div class="grid-3"><div class="form-group"><label>سعر الشراء *</label><input type="number" id="purchasePrice" class="form-control" step="0.01" min="0" required></div><div class="form-group"><label>سعر البيع *</label><input type="number" id="salePrice" class="form-control" step="0.01" min="0" required></div><div class="form-group"><label>الكمية الحالية *</label><input type="number" id="productQuantity" class="form-control" min="0" required></div></div>
                    <div class="grid-2"><div class="form-group"><label>الحد الأدنى للتنبيه</label><input type="number" id="minQuantity" class="form-control" value="5" min="1"></div></div>
                    <div class="form-group"><label>وصف المنتج</label><textarea id="productDescription" class="form-control" rows="3"></textarea></div>
                    <div class="modal-footer" style="padding:20px 0 0 0; border-top:1px solid var(--border);"><button type="button" class="btn btn-secondary modal-cancel" onclick="closeModal('addProductModal')">إلغاء</button><button type="submit" class="btn btn-primary">حفظ المنتج</button></div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>document.getElementById('currentDate').textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });</script>
</body>
</html>
