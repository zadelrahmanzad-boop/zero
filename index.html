<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Zero POS">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Zero POS">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <title>Zero POS - تسجيل الدخول</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @media (max-width: 480px) {
            .auth-container { padding: 20px 15px; margin: 10px; border-radius: 15px; }
            .company-logo-display { width: 70px; height: 70px; }
            .company-name-display { font-size: 18px; }
            .form-control { padding: 12px; font-size: 16px; }
            .btn { padding: 14px 20px; font-size: 16px; min-height: 48px; }
        }
        .install-prompt {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: white; padding: 15px 25px; border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); display: none; align-items: center;
            gap: 15px; z-index: 9999; direction: rtl; max-width: 90%;
        }
        .install-prompt.show { display: flex; }
        .install-prompt button {
            background: var(--primary); color: white; border: none;
            padding: 8px 20px; border-radius: 8px; cursor: pointer; white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div id="companyDisplay">
                <img id="loginLogo" class="company-logo-display" src="" alt="شعار الشركة" style="display:none;">
                <h1 id="loginCompanyName" class="company-name-display">Zero POS</h1>
            </div>

            <h2 style="text-align:center; margin-bottom:30px; color:var(--dark);">تسجيل الدخول</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="admin@zero.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top:25px;">
                    <span>🔐</span> تسجيل الدخول
                </button>
            </form>

            <div id="firstTimeSetup" style="text-align:center; margin-top:20px; display:none;">
                <p>لم يتم تسجيل شركة بعد؟</p>
                <a href="register.html" class="btn btn-secondary btn-block" style="margin-top:10px;">
                    <span>🏢</span> تسجيل شركة جديدة
                </a>
            </div>

            <div style="text-align:center; margin-top:20px; color:var(--secondary); font-size:14px;">
                <p>المدير فقط يمكنه تسجيل الدخول هنا</p>
                <p>المستخدمين يتم إضافتهم من لوحة التحكم</p>
            </div>
        </div>
    </div>

    <div class="install-prompt" id="installPrompt">
        <span>📱 تثبيت Zero POS على جهازك</span>
        <button onclick="installApp()">تثبيت</button>
        <button onclick="dismissInstall()" style="background:var(--secondary);">لاحقاً</button>
    </div>

    <script src="app.js"></script>
    <script>
        // Check if company exists
        (function() {
            function checkFirstTime() {
                var request = indexedDB.open('ZeroPOS', 2);
                request.onsuccess = function() {
                    var db = request.result;
                    var tx = db.transaction('companies', 'readonly');
                    var store = tx.objectStore('companies');
                    var getAll = store.getAll();
                    getAll.onsuccess = function() {
                        var companies = getAll.result || [];
                        if (companies.length === 0) {
                            document.getElementById('firstTimeSetup').style.display = 'block';
                        } else {
                            var company = companies[0];
                            if (company.logo) {
                                document.getElementById('loginLogo').src = company.logo;
                                document.getElementById('loginLogo').style.display = 'block';
                            }
                            document.getElementById('loginCompanyName').textContent = company.name;
                        }
                        db.close();
                    };
                };
            }

            checkFirstTime();

            // Install prompt
            var deferredPrompt;
            window.addEventListener('beforeinstallprompt', function(e) {
                e.preventDefault();
                deferredPrompt = e;
                document.getElementById('installPrompt').classList.add('show');
            });

            window.installApp = function() {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then(function(choiceResult) {
                        if (choiceResult.outcome === 'accepted') {
                            document.getElementById('installPrompt').classList.remove('show');
                        }
                        deferredPrompt = null;
                    });
                }
            };

            window.dismissInstall = function() {
                document.getElementById('installPrompt').classList.remove('show');
            };
        })();
    </script>
</body>
</html>
